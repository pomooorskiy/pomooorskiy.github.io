<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Партия подотчётного парламента</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- SEO -->
  <meta name="description" content="Официальный сайт Партии подотчётного парламента. Программа, творчество, игры и связь с партией.">
  <meta property="og:title" content="Партия подотчётного парламента">
  <meta property="og:description" content="Официальный сайт Партии подотчётного парламента.">
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1KRb9pi-oAD3qofva0diEfKu99MLGGNY4">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ================= ШАПКА ================= -->
<header class="site-header">
  <div class="header-left">
    <img src="https://lh3.googleusercontent.com/d/1KRb9pi-oAD3qofva0diEfKu99MLGGNY4" alt="Логотип" class="site-logo">
    <h1 class="site-title">Партия подотчётного парламента</h1>
  </div>

  <!-- Меню навигации -->
  <nav class="main-nav">
    <a href="#creativity" class="nav-link">Творчество</a>
    <a href="#program" class="nav-link">Программа</a>
    <a href="#games" class="nav-link">Игры</a>
    <a href="#social" class="nav-link">Соцсети</a>
    <a href="#contact" class="nav-link">Связь</a>
  </nav>

  <!-- Переключатель темы -->
  <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
    <span class="theme-icon">🌙</span>
  </button>
</header>

  <!-- ================= ОСНОВНОЙ КОНТЕНТ ================= -->
  <main class="main-content">

    <!-- ===== Параллакс-фон ===== -->
    <div class="parallax-bg" id="parallaxBg"></div>

    <!-- ===== Карусель ===== -->
    <h2 class="section-title reveal" id="creativity">Наше творчество</h2>

    <div class="coverflow-container reveal">
      <div class="coverflow" id="coverflow">
        <div class="cover-card" data-index="0">
          <img src="https://lh3.googleusercontent.com/d/11yExmHl2_4sILhU3yXcD976mVt4EnMS0" alt="Фото 1">
        </div>
        <div class="cover-card" data-index="1">
          <img src="https://lh3.googleusercontent.com/d/1a2Y82cggkXUHGPJgj5Y0Zy6eoIq7WSXH" alt="Фото 2">
        </div>
        <div class="cover-card" data-index="2">
          <img src="https://lh3.googleusercontent.com/d/1baatLZo94wZDTAY1A8ILlWnXV43MS1YX" alt="Фото 3">
        </div>
        <div class="cover-card" data-index="3">
          <img src="https://lh3.googleusercontent.com/d/1eAmCLRt6-QHr4Pz4vQH09cX4YTz5L47j" alt="Фото 4">
        </div>
        <div class="cover-card" data-index="4">
          <img src="https://lh3.googleusercontent.com/d/1fcIa57aemLm1UfGsn1VyRv45o8MCPycD" alt="Фото 5">
        </div>
        <div class="cover-card" data-index="5">
          <img src="https://lh3.googleusercontent.com/d/1oWst60IcuJ9-eNtj0oppauPxtbGclZTa" alt="Фото 6">
        </div>
        <div class="cover-card" data-index="6">
          <img src="https://lh3.googleusercontent.com/d/1pUW1eBIeuplFf4Oax2VZgZDfNY2qcshA" alt="Фото 7">
        </div>
        <div class="cover-card" data-index="7">
          <img src="https://lh3.googleusercontent.com/d/1xmhoJLvMsoODrU9KX19RNKkVkL16oaIr" alt="Фото 8">
        </div>
      </div>

      <div class="controls">
        <button class="nav-btn" id="prevBtn">❮</button>
        <button class="nav-btn" id="nextBtn">❯</button>
      </div>
    </div>

    <!-- ===== Гимн ===== -->
    <h2 class="section-title reveal">Наш гимн</h2>

    <div class="player-wrapper reveal">
      <div id="my-player"></div>
    </div>

    <!-- ===== Программа партии ===== -->
    <h2 class="section-title section-title-prog reveal" id="program">Программа партии</h2>

    <div class="grid-section reveal">
      <div class="grid-cell"><span class="cell-number">1</span></div>
      <div class="grid-cell"><span class="cell-number">2</span></div>
      <div class="grid-cell"><span class="cell-number">3</span></div>
      <div class="grid-cell"><span class="cell-number">4</span></div>
      <div class="grid-cell"><span class="cell-number">5</span></div>
      <div class="grid-cell"><span class="cell-number">6</span></div>
    </div>

<!-- ===== Игры ===== -->
<h2 class="section-title reveal" id="games">Игры</h2>

<div class="games-grid">

  <!-- Змейка -->
  <div class="game-block reveal">
    <h3 class="game-title">Змейка</h3>
    <div class="snake-wrapper">
      <div class="snake-canvas-box">
        <canvas id="snakeCanvas" width="600" height="600"></canvas>
      </div>
      <div class="snake-controls">
        <button class="snake-btn" id="snakeUp">▲</button>
        <div class="snake-row">
          <button class="snake-btn" id="snakeLeft">◀</button>
          <button class="snake-btn" id="snakeDown">▼</button>
          <button class="snake-btn" id="snakeRight">▶</button>
        </div>
      </div>
      <p class="snake-score">Счёт: <span id="snakeScore">0</span></p>
    </div>
  </div>

  <!-- Пазл -->
  <div class="game-block reveal">
    <h3 class="game-title">Собери пазл</h3>
    <div class="puzzle-wrapper">
      <div class="puzzle-info">
        <p class="puzzle-score">Ходов: <span id="puzzleMoves">0</span></p>
      </div>
      <div class="puzzle-board" id="puzzleBoard"></div>
      <button class="puzzle-btn" id="puzzleShuffle">Перемешать</button>
    </div>
  </div>

</div>

<!-- ===== Генератор движухи ===== -->
<h2 class="section-title reveal" id="generator">Генератор движухи</h2>

<div class="generator-wrapper reveal">
  <div class="generator-cells">
    <div class="generator-cell" id="genCell1">
      <span class="generator-text"></span>
    </div>
    <div class="generator-cell" id="genCell2">
      <span class="generator-text"></span>
    </div>
    <div class="generator-cell" id="genCell3">
      <span class="generator-text"></span>
    </div>
  </div>
  <button class="generator-btn" id="generatorBtn">Сгенерировать</button>
</div>
    
    <!-- ===== Соцсети партии ===== -->
    <h2 class="section-title reveal" id="social">Соцсети партии</h2>

    <div class="social-cell reveal"></div>

    <!-- ===== Связь с партией ===== -->
    <h2 class="section-title reveal" id="contact">Связь с партией</h2>

    <div class="contact-wrapper reveal">
      <div class="contact-section">
        <textarea class="contact-input" id="contactInput" placeholder="Напишите ваше сообщение..."></textarea>
        <button class="contact-btn" id="contactBtn">Отправить</button>
        <p class="contact-status" id="contactStatus"></p>
      </div>
    </div>

  </main>

  <!-- ================= ИКОНКА, ЕЗДЯЩАЯ ПО КРУГУ ================= -->
  <div class="orbit-container">
    <div class="orbit">
      <img src="https://lh3.googleusercontent.com/d/10Ms2C-0KkkM_71LcEDsishBseBWGh4X1" alt="Иконка" class="orbit-icon">
    </div>
  </div>

  <!-- ================= КНОПКА НАВЕРХ ================= -->
  <button class="scroll-top" id="scrollTop" aria-label="Наверх">▲</button>

  <!-- ================= PLAYERJS ================= -->
<script src="playerjs.js" type="text/javascript"></script>
<script>
  var player = new Playerjs({
    id: "my-player",
    file: "https://github.com/user-attachments/files/33350217/Project_90golosuyPPP.1.mp3"
  });
</script>

  <!-- ================= ОСНОВНОЙ СКРИПТ ================= -->
  <script src="script.js"></script>
</body>
</html>
