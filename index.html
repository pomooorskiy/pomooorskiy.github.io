<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Партия подотчётного парламента</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================= ШАПКА ================= -->
  <header class="site-header">
    <img src="https://lh3.googleusercontent.com/d/1KRb9pi-oAD3qofva0diEfKu99MLGGNY4" alt="Логотип" class="site-logo">
    <h1 class="site-title">Партия подотчётного парламента</h1>
  </header>

  <!-- ================= ОСНОВНОЙ КОНТЕНТ ================= -->
  <main class="main-content">

    <!-- ===== Карусель ===== -->
    <h2 class="section-title">Наше творчество</h2>

    <div class="coverflow-container">
      <div class="coverflow" id="coverflow">
        <div class="cover-card" data-index="0">
          <img src="https://lh3.googleusercontent.com/d/11yExmHl2_4sILhU3yXcD976mVt4EnMS0" alt="Фото 1">
        </div>
        <div class="cover-card" data-index="1">
          <img src="https://lh3.googleusercontent.com/d/1a2Y82cggkXUHGPJgj5Y0Zy6eoIq7WSXH" alt="Фото 2">
        </div>
        <div class="cover-card" data-index="2">
          <img src="https://lh3.googleusercontent.com/d/1baatLZo94wZDTAY1A8ILlWnXV43MS1YX" alt="Фото 3">
        </div>
        <div class="cover-card" data-index="3">
          <img src="https://lh3.googleusercontent.com/d/1eAmCLRt6-QHr4Pz4vQH09cX4YTz5L47j" alt="Фото 4">
        </div>
        <div class="cover-card" data-index="4">
          <img src="https://lh3.googleusercontent.com/d/1fcIa57aemLm1UfGsn1VyRv45o8MCPycD" alt="Фото 5">
        </div>
        <div class="cover-card" data-index="5">
          <img src="https://lh3.googleusercontent.com/d/1oWst60IcuJ9-eNtj0oppauPxtbGclZTa" alt="Фото 6">
        </div>
        <div class="cover-card" data-index="6">
          <img src="https://lh3.googleusercontent.com/d/1pUW1eBIeuplFf4Oax2VZgZDfNY2qcshA" alt="Фото 7">
        </div>
        <div class="cover-card" data-index="7">
          <img src="https://lh3.googleusercontent.com/d/1xmhoJLvMsoODrU9KX19RNKkVkL16oaIr" alt="Фото 8">
        </div>
      </div>

      <div class="controls">
        <button class="nav-btn" id="prevBtn">❮</button>
        <button class="nav-btn" id="nextBtn">❯</button>
      </div>
    </div>

    <!-- ===== Программа партии ===== -->
    <h2 class="section-title section-title-prog">Программа партии</h2>

    <div class="grid-section">
      <div class="grid-cell"><span class="cell-number">1</span></div>
      <div class="grid-cell"><span class="cell-number">2</span></div>
      <div class="grid-cell"><span class="cell-number">3</span></div>
      <div class="grid-cell"><span class="cell-number">4</span></div>
      <div class="grid-cell"><span class="cell-number">5</span></div>
      <div class="grid-cell"><span class="cell-number">6</span></div>
    </div>

    <!-- ===== Соцсети партии ===== -->
    <h2 class="section-title">Соцсети партии</h2>

    <div class="social-cell"></div>

    <!-- ===== Связь с партией ===== -->
    <h2 class="section-title">Связь с партией</h2>

    <div class="contact-wrapper">
      <div class="contact-section">
        <textarea class="contact-input" id="contactInput" placeholder="Напишите ваше сообщение..."></textarea>
        <button class="contact-btn" id="contactBtn">Отправить</button>
        <p class="contact-status" id="contactStatus"></p>
      </div>
    </div>

  </main>

  <!-- ================= ИКОНКА, ЕЗДЯЩАЯ ПО КРУГУ ================= -->
  <div class="orbit-container">
    <div class="orbit">
      <img src="https://lh3.googleusercontent.com/d/10Ms2C-0KkkM_71LcEDsishBseBWGh4X1" alt="Иконка" class="orbit-icon">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
